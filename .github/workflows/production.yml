# Robot de vérification et de mise en ligne.
#
# - Sur une proposition de changement (pull request) : vérifie, puis publie un aperçu
#   à l'adresse https://pr-<numéro>--trame-envergo.netlify.app (branché sur la base de production).
# - Quand une proposition est fusionnée dans main : vérifie, met à jour la base Supabase,
#   puis publie le site. Si une vérification échoue, rien n'est mis en ligne.
#
# Secrets GitHub nécessaires : SUPABASE_ACCESS_TOKEN, NETLIFY_AUTH_TOKEN.
# Variables GitHub : SUPABASE_PROJECT_ID, NETLIFY_SITE_ID.

name: Vérifier et mettre en ligne

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Une nouvelle version d'une proposition remplace la précédente ; la production attend son tour.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NETLIFY_CLI: netlify-cli@27.17.0

jobs:
  verifier:
    name: Vérifications (types, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Démarrer une base Supabase de test
        run: npm run db:start
      - run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npm run test:e2e
      - name: Garder les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-playwright
          path: test-results
          retention-days: 7

  apercu:
    name: Aperçu en ligne
    needs: verifier
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Publier l'aperçu
        run: npx --yes "$NETLIFY_CLI" deploy --build --alias "pr-${{ github.event.number }}"
      - name: Donner l'adresse dans la proposition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://pr-${{ github.event.number }}--trame-envergo.netlify.app"
          gh pr comment "${{ github.event.number }}" --edit-last --create-if-none \
            --body "Aperçu prêt : $url (branché sur la base de production)."

  production:
    name: Mise en ligne
    needs: verifier
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Avant le site : les nouveaux écrans peuvent avoir besoin des nouvelles tables.
      - name: Mettre à jour la base Supabase
        run: npx supabase db push --remote="${{ vars.SUPABASE_PROJECT_ID }}" --yes
      - name: Publier le site
        run: npx --yes "$NETLIFY_CLI" deploy --build --prod
